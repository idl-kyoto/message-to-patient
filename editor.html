<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message to Patient 2階</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header>
  <h1>Message to Patient 2階</h1>
  <div class="top">
    <label>病気の名前 <input type="text" id="title"></label>
    <label>病気のID <input type="text" id="did" placeholder="new-disease"></label>
  </div>
  <div class="buttons">
    <button type="button" id="export">データを書き出す</button>
    <button type="button" id="import">データを読み込む</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
    <button type="button" id="example">例を見る（骨粗鬆症）</button>
    <button type="button" id="toSheet">1階で書面を作る</button>
  </div>
  <p class="usage">1. 表のマスをクリックします。2. 下の欄で、名前や文を入力します。3. ＋で、行や列を増やします。</p>
  <div id="msg" role="alert"></div>
  <div id="note" role="status"></div>
</header>
<main>
  <div id="gridwrap"><div id="grid"></div></div>
</main>
<footer id="panel"></footer>
<script src="editor-core.js"></script>
<script src="editor.js"></script>
</body>
</html>
